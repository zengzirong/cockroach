name: Test Optimizer Rules

on:
  push:
    paths:
      - 'pkg/sql/opt/norm/rules/*.opt'
      - 'pkg/sql/opt/norm/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test optimizer rules
        run: bazel test //pkg/sql/opt/norm:norm_test --test_output=errors