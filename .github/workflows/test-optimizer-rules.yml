name: Test Optimizer Rules

on:
  push:
    paths:
      - 'pkg/sql/opt/norm/rules/*.opt'
      - 'pkg/sql/opt/norm/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build dev tool
        run: bazel build //pkg/cmd/dev
        
      - name: Test optimizer rules
        run: ./dev test pkg/sql/opt/norm